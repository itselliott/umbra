# Local Postgres for development.
#   docker compose up -d   → starts the DB on localhost:5432
#   docker compose down    → stops it (data persists in the named volume)
services:
  db:
    image: postgres:16
    container_name: umbra-db
    environment:
      POSTGRES_USER: umbra
      POSTGRES_PASSWORD: umbra
      POSTGRES_DB: umbra
    ports:
      - "5432:5432"
    volumes:
      - umbra_pgdata:/var/lib/postgresql/data

volumes:
  umbra_pgdata:
