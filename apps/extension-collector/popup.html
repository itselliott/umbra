<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --bg:#0c0e13; --panel:#1a1e2a; --border:#262b38; --text:#e7e9f0;
    --muted:#8b92a5; --muted-2:#5c6373; --brand:#7c5cff; --ok:#3ecf8e; --warn:#ff8c42;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:300px;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
  .head{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--border)}
  .mark{width:22px;height:22px;border-radius:6px;
    background:linear-gradient(135deg,var(--brand),#a78bfa);
    display:flex;align-items:center;justify-content:center;font-size:13px}
  .head b{font-size:14px}
  .head span{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
    color:var(--brand);background:#2a2350;padding:2px 6px;border-radius:4px}
  .body{padding:14px 15px}
  .row{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;margin-bottom:9px}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
  p{color:var(--muted);font-size:12px;line-height:1.55;margin-bottom:7px}
  code{background:#0c0e13;border:1px solid var(--border);padding:1px 5px;border-radius:4px;
    font-size:11px;color:#b9a6ff;word-break:break-all}
  .muted{color:var(--muted-2);font-size:11px;margin-top:6px;line-height:1.5}
  .loading{padding:22px 15px;text-align:center;color:var(--muted)}
  .form{display:flex;flex-direction:column;gap:7px;margin:11px 0 4px}
  .form input{background:#0c0e13;border:1px solid var(--border);color:var(--text);
    padding:7px 10px;border-radius:7px;font-family:inherit;font-size:12px}
  .form input::placeholder{color:var(--muted-2)}
  .form button{background:var(--brand);border:none;color:#fff;font-weight:600;font-size:12.5px;
    padding:8px;border-radius:7px;cursor:pointer;font-family:inherit}
  .form button:hover{background:#6b4ff0}
  .formMsg{font-size:11px;color:var(--muted);margin-top:5px;min-height:14px}
  .formMsg.ok{color:var(--ok)}
</style>
</head>
<body>
  <div class="head">
    <div class="mark">◑</div><b>Umbra</b><span>Collector</span>
  </div>
  <div class="body" id="body"><div class="loading">Checking status…</div></div>
  <script src="popup.js"></script>
</body>
</html>
